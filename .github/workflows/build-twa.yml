name: Build TWA (Android)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Install SDK parts
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Bubblewrap
        run: npm i -g @bubblewrap/cli
      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
      - name: Keystore (secret, or generate a new one)
        working-directory: twa
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > android.keystore
          else keytool -genkeypair -v -keystore android.keystore -alias elitereg -keyalg RSA -keysize 2048 -validity 10000 -storepass elitereg123 -keypass elitereg123 -dname "CN=EliteReg, O=EliteReg, C=NG"; fi
          FP=$(keytool -list -v -keystore android.keystore -alias elitereg -storepass "${KS_PASS:-elitereg123}" | grep "SHA256:" | head -1 | sed 's/.*SHA256: //')
          echo "### SHA256 fingerprint for assetlinks.json" >> $GITHUB_STEP_SUMMARY
          echo "\`$FP\`" >> $GITHUB_STEP_SUMMARY
      - name: Build
        working-directory: twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'elitereg123' }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'elitereg123' }}
        run: bubblewrap build --skipPwaValidation
      - uses: actions/upload-artifact@v4
        with:
          name: elitereg-twa
          path: |
            twa/app-release-signed.apk
            twa/app-release-bundle.aab
            twa/android.keystore
