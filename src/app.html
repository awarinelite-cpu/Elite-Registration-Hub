<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0f766e" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="EliteReg" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<script>
			try {
				var t = localStorage.getItem('elitereg_theme');
				var c = document.documentElement.classList;
				if (t ? t === 'dark' || t === 'forest' : matchMedia('(prefers-color-scheme: dark)').matches) c.add('dark');
				if (t === 'forest') {
					c.add('forest');
					document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f2623');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
